name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Swift package
        run: swift test
      - name: Check shell syntax
        run: |
          for script in *.sh Tests/*.sh; do
            bash -n "$script"
          done
      - name: Check installer and uninstaller
        run: bash Tests/install-tests.sh
